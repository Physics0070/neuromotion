# Every push: unit tests, dependency audit, production build, then the real-browser tests under the production CSP.
name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run audit:prod
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env: { ALLOW_UNREVIEWED: '1' } # CI builds the pilot; the public build is gated by `npm run release`
      - run: node scripts/e2e.mjs
      - run: node scripts/a11y.mjs
